document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2ba03740-9208-403d-8ca5-78c44a8ec990\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>\n  body { margin:0; background:#f2f4f6; }\n  a { color:#1b7fb8; text-decoration:none; }\n  a:hover { color:#12587f; text-decoration:underline; }\n  input { font-family:Helvetica,Arial,sans-serif; }\n<\u002Fstyle>\n<script src=\"ce7e8259-fdfd-4124-8a91-60e9b1596f2d\"><\u002Fscript>\n<\u002Fhelmet>\n\n<section style=\"min-height:100vh; box-sizing:border-box; padding:44px; font-family:Helvetica,Arial,sans-serif; color:#22303c; display:flex; flex-wrap:wrap; gap:34px; align-items:flex-start\">\n\n  <div style=\"display:flex; flex-direction:column; gap:14px; width:280px; flex:0 0 auto\">\n    <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8d99a4\">Your details<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:10px\">\n      <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#8d99a4\">Name\n        <input value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" style=\"font-size:13px; color:#22303c; padding:8px 10px; border:1px solid #d3dae0; background:#fff\">\n      <\u002Flabel>\n      <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#8d99a4\">Job title\n        <input value=\"{{ role }}\" sc-camel-on-change=\"{{ setRole }}\" style=\"font-size:13px; color:#22303c; padding:8px 10px; border:1px solid #d3dae0; background:#fff\">\n      <\u002Flabel>\n      <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#8d99a4\">Email\n        <input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"font-size:13px; color:#22303c; padding:8px 10px; border:1px solid #d3dae0; background:#fff\">\n      <\u002Flabel>\n      <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#8d99a4\">Phone — optional\n        <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"Leave blank to omit\" style=\"font-size:13px; color:#22303c; padding:8px 10px; border:1px solid #d3dae0; background:#fff\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"height:1px; background:#e2e7eb; margin:4px 0\"><\u002Fdiv>\n\n    <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8d99a4\">Social links<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:8px\">\n      <sc-for list=\"{{ socialRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; align-items:center; gap:6px\">\n          <sc-raw-select value=\"{{ row.kind }}\" sc-camel-on-change=\"{{ row.onKind }}\" style=\"font-family:Helvetica,Arial,sans-serif; font-size:11.5px; color:#22303c; padding:6px 4px; border:1px solid #d3dae0; background:#fff; width:86px; flex:0 0 auto\">\n            <sc-for list=\"{{ kindOptions }}\" as=\"opt\" hint-placeholder-count=\"6\">\n              <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <input value=\"{{ row.url }}\" sc-camel-on-change=\"{{ row.onUrl }}\" style=\"font-size:11.5px; color:#22303c; padding:6px 8px; border:1px solid #d3dae0; background:#fff; flex:1 1 auto; min-width:0\">\n          <button sc-camel-on-click=\"{{ row.onRemove }}\" title=\"Remove\" style=\"flex:0 0 auto; width:26px; height:28px; border:1px solid #d3dae0; background:#fff; color:#8d99a4; font-size:14px; line-height:1; cursor:pointer\" style-hover=\"color:#c04a2b; border-color:#e0b8ab\">×<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ canAdd }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ addSocial }}\" style=\"align-self:flex-start; font-family:Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; background:#fff; border:1px dashed #c3ccd4; padding:7px 10px; cursor:pointer; color:#1b7fb8\" style-hover=\"border-color:#1b7fb8\">+ Add link<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ copy }}\" style=\"font-family:Helvetica,Arial,sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; background:#1b7fb8; border:none; padding:11px 14px; cursor:pointer; color:#fff; margin-top:4px\" style-hover=\"background:#12587f\">{{ label }}<\u002Fbutton>\n    <div style=\"font-size:11.5px; line-height:1.6; color:#8d99a4\">Paste copied html into Outlook's signature editor.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:14px; flex:1 1 380px; min-width:0\">\n    <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8d99a4\">Preview<\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #e2e7eb; padding:26px 30px; display:flex; flex-direction:column; gap:18px; align-self:flex-start\">\n      <div style=\"display:flex; align-items:center; gap:22px\">\n        <a href=\"https://cubcloud.ai\" style=\"display:block\"><img src=\"3f9442d1-96f7-4ce6-a251-d038c68ceec1\" alt=\"CubCloud AI\" style=\"height:72px; width:auto; display:block; border:0\"><\u002Fa>\n        <div style=\"width:2px; align-self:stretch; background:linear-gradient(#e8791f,#1b7fb8)\"><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:2px\">\n          <div style=\"font-size:16px; font-weight:700; color:#4a5158; letter-spacing:.01em; line-height:1.3\">{{ name }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#64717c; line-height:1.5; margin-top:3px\">{{ roleLine }}<\u002Fdiv>\n          <div style=\"height:4px\"><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:7px; font-size:12.5px; line-height:1.6\">\n            <img src=\"8fe6f5e9-9685-4e02-8351-84ee1eb16a40\" alt=\"\" style=\"width:14px; height:14px; display:block\">\n            <a href=\"https://cubcloud.ai\">cubcloud.ai<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:7px; font-size:12.5px; line-height:1.6\">\n            <img src=\"bd9cc051-5b28-4d0e-b531-974e97958f0f\" alt=\"\" style=\"width:14px; height:14px; display:block\">\n            <a href=\"{{ mailto }}\">{{ email }}<\u002Fa>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPhone }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; align-items:center; gap:7px; font-size:12.5px; line-height:1.6; color:#64717c\">\n              <img src=\"094040e2-585c-4739-b7ea-d507732bcbba\" alt=\"\" style=\"width:14px; height:14px; display:block\">\n              <span>{{ phone }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"height:12px\"><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:9px\">\n            <sc-for list=\"{{ socialRows }}\" as=\"row\">\n              <a href=\"{{ row.url }}\" title=\"{{ row.label }}\" style=\"display:flex; align-items:center; text-decoration:none\">\n                <sc-if value=\"{{ row.isImg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"{{ row.iconStyle }}\"><\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ row.isChip }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"width:18px; height:18px; border-radius:3px; background:#1b7fb8; color:#fff; font-size:9.5px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center\">{{ row.letter }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <img src=\"c924d6fe-2b24-4877-8cc4-fa5f732cae40\" alt=\"\" style=\"display:block; width:100%; height:4px\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:420}}\">\nconst SRC = {\n  logo: 'uploads/logo-1788636190141-rxps.png',\n  bar: 'icons/bar.png',\n  vrule: 'icons/rule-vertical.png',\n  uiWeb: 'icons/ui-web.png',\n  uiMail: 'icons/ui-mail.png',\n  uiPhone: 'icons/ui-phone.png',\n  linkedin: 'icons/linkedin.png',\n  x: 'icons/x.png', instagram: 'icons/instagram.png', facebook: 'icons/facebook.png', youtube: 'icons/youtube.png'\n};\n\nconst PLATFORMS = {\n  linkedin:  { label: 'LinkedIn',  icon: 'linkedin',  url: 'https://www.linkedin.com/company/cubcloud-ai/' },\n  x:         { label: 'X',         icon: 'x',         url: 'https://x.com/CubCloudAI' },\n  instagram: { label: 'Instagram', icon: 'instagram', url: 'https://www.instagram.com/cubcloudai/' },\n  facebook:  { label: 'Facebook',  icon: 'facebook',  url: 'https://www.facebook.com/CubCloudAI' },\n  youtube:   { label: 'YouTube',   icon: 'youtube',   url: 'https://www.youtube.com/@CubCloudAI' },\n  custom:    { label: 'Other',     letter: '\\u2197', url: 'https://' }\n};\n\n// Hosted image URLs (Becky's OneDrive, testing set). &download=1 makes\n// SharePoint serve the file itself rather than a preview page.\n// download.aspx?share=<token> serves the file bytes directly. The\n// short :i:/g/ links only redirect to a preview page, which Outlook\n// will not follow — that's why embedded images came up blank.\nconst DL = 'https://cubcloudai-my.sharepoint.com/personal/becky_cubcloud_ai/_layouts/15/download.aspx?share=';\nconst SHARE = {\n  bar:       'IQDC50y1D-bzQqKRa3dux6TjARKrWptZSkdm-oKJC001JXo',\n  facebook:  'IQB5lnf8hLKsQrrWqECm28noAXbneeQ08c-P6iE5g7qR4bE',\n  instagram: 'IQAhEJkFe57gTroTOv4JFYYnAe692sAmhHmiXMrWzYktWoY',\n  linkedin:  'IQCE9EX_JW0QS6sTufCXeQAhATnmtN9gwvpJ8kM-bAS13ig',\n  logo:      'IQASUv8PmCkMSJA0tlUC_kUoASZmbdHO9Vc0IB9zDFs_f4k',\n  vrule:     'IQDCZ2JKerxERKJlwhjdKft7AaCZ_ldYeXXdJEPqroDgy5Y',\n  uiMail:    'IQBqKPzXwPMERYxgqES6LPX1AVFLEZJGt9iYzdTDyaxS0OA',\n  uiPhone:   'IQD8vghPaa5qSp1UDN9i9Wm0AbsPLc9XNf98dRWJgxEgCMw',\n  uiWeb:     'IQB9MzgdJrT8Ra1l9I5ArXh3AVYOPFsqpjKI5X7RH75dbuA',\n  x:         'IQAH_-voMXG9QYf1wp1r30ydATBNmChYl-syJNNga-SLQQ4',\n  youtube:   'IQD1zOajS33ESJzIJNhmdz1mASUcPRPwRuNJ6cKOlKeY_60'\n};\n// Set GH_BASE to the GitHub Pages URL (with trailing slash) to switch every\n// image over in one line, e.g. 'https://beckyross.github.io/cubcloud-signature/'\nconst GH_BASE = 'https://cubcloud-becky.github.io/cubcloud-email-signature/';\nconst GH_FILE = { bar: 'bar.png', logo: 'logo.png', vrule: 'vrule.png', uiWeb: 'web.png',\n  uiMail: 'mail.png', uiPhone: 'phone.png', linkedin: 'linkedin.png', x: 'x.png',\n  instagram: 'instagram.png', facebook: 'facebook.png', youtube: 'youtube.png' };\nconst HOSTED = GH_BASE\n  ? Object.fromEntries(Object.entries(GH_FILE).map(([k, f]) => [k, GH_BASE + f]))\n  : Object.fromEntries(Object.entries(SHARE).map(([k, t]) => [k, DL + t]));\n\nlet uid = 0;\n\nclass Component extends DCLogic {\n  state = {\n    name: 'Your Name', role: 'Your Job Title',\n    phone: '555.555.5555', email: 'yourname@cubcloud.ai',\n    socials: ['linkedin', 'x', 'instagram', 'facebook', 'youtube'].map(k => ({ id: ++uid, kind: k, url: PLATFORMS[k].url })),\n    copied: false, data: null\n  };\n\n  componentDidMount() {\n    if (window.SIG_ASSETS) { this.setState({ data: window.SIG_ASSETS }); return; }\n    const toData = async (url) => {\n      const r = await fetch(url);\n      const b = await r.blob();\n      return await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); });\n    };\n    Promise.all(Object.entries(SRC).map(async ([k, u]) => [k, await toData(u)]))\n      .then(pairs => this.setState({ data: Object.fromEntries(pairs) }))\n      .catch(() => this.setState({ data: { ...SRC } }));\n  }\n\n  esc(s) { return String(s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;'); }\n\n  html() {\n    // hosted URLs win; embedded data URIs remain the fallback\n    const d = { ...(this.state.data || {}), ...HOSTED };\n    const { name, role, phone, email } = this.state;\n    const hasPhone = !!phone.trim();\n\n    // Word/Outlook ignores line-height on inline spacers, so every\n    // vertical measure below is a table row with an explicit height.\n    // Keeping them fixed makes the block height deterministic, which is\n    // what the gradient rule image is sized from.\n    const H = { name: 22, role: 20, gapA: 6, contact: 22, gapB: 12, social: 20 };\n    const rows = 2 + (hasPhone ? 1 : 0);\n    const rh = H.name + H.role + H.gapA + rows * H.contact + H.gapB + H.social;\n\n    const spacer = h => `<tr><td height=\"${h}\" style=\"height:${h}px;font-size:0;line-height:0\">&nbsp;<\u002Ftd><\u002Ftr>`;\n    const chip = (href, txt) => `<a href=\"${this.esc(href)}\" style=\"text-decoration:none\"><span style=\"display:inline-block;width:18px;height:18px;background:#1b7fb8;color:#ffffff;font-size:9.5px;font-weight:bold;text-align:center;line-height:18px;font-family:Helvetica,Arial,sans-serif\">${txt}<\u002Fspan><\u002Fa>`;\n    const img = (href, src, alt) => `<a href=\"${this.esc(href)}\" style=\"text-decoration:none\"><img src=\"${src || ''}\" alt=\"${alt}\" width=\"18\" height=\"18\" style=\"display:block;width:18px;height:18px;border:0\" /><\u002Fa>`;\n    const socialCell = inner => `<td valign=\"middle\" width=\"18\" style=\"width:18px;padding-right:9px;font-size:0;line-height:0\">${inner}<\u002Ftd>`;\n    const contactRow = (icon, inner) => `<tr><td valign=\"middle\" width=\"14\" height=\"${H.contact}\" style=\"width:14px;height:${H.contact}px;padding:0 7px 0 0\"><img src=\"${icon || ''}\" alt=\"\" width=\"14\" height=\"14\" style=\"display:block;width:14px;height:14px;border:0\" /><\u002Ftd><td valign=\"middle\" height=\"${H.contact}\" style=\"height:${H.contact}px;font-size:12.5px;line-height:${H.contact}px;color:#64717c\">${inner}<\u002Ftd><\u002Ftr>`;\n    const socialHtml = this.state.socials.map(x => {\n      const p = PLATFORMS[x.kind] || PLATFORMS.custom;\n      return socialCell(p.icon ? img(x.url, d[p.icon], p.label) : chip(x.url, p.letter));\n    }).join('');\n\n    return `<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"font-family:Helvetica,Arial,sans-serif;color:#4a5158\">\n<tr>\n<td valign=\"middle\" style=\"padding-right:22px\"><a href=\"https://cubcloud.ai\" style=\"text-decoration:none\"><img src=\"${d.logo || ''}\" alt=\"CubCloud AI\" height=\"72\" style=\"height:72px;display:block;border:0\" /><\u002Fa><\u002Ftd>\n<td valign=\"middle\" width=\"2\" style=\"width:2px;font-size:0;line-height:0\"><img src=\"${d.vrule || ''}\" alt=\"\" width=\"2\" height=\"${rh}\" style=\"display:block;width:2px;height:${rh}px;border:0\" /><\u002Ftd>\n<td valign=\"middle\" style=\"padding-left:22px\">\n<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"font-family:Helvetica,Arial,sans-serif\">\n<tr><td height=\"${H.name}\" style=\"height:${H.name}px;font-size:16px;line-height:${H.name}px;font-weight:bold;color:#4a5158\">${this.esc(name)}<\u002Ftd><\u002Ftr>\n<tr><td height=\"${H.role}\" style=\"height:${H.role}px;font-size:12.5px;line-height:${H.role}px;color:#64717c\">${this.esc(role)} | CubCloud AI<\u002Ftd><\u002Ftr>\n${spacer(H.gapA)}\n<tr><td>\n<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n${contactRow(d.uiWeb, `<a href=\"https://cubcloud.ai\" style=\"color:#1b7fb8;text-decoration:none\">cubcloud.ai<\u002Fa>`)}\n${contactRow(d.uiMail, `<a href=\"mailto:${this.esc(email)}\" style=\"color:#1b7fb8;text-decoration:none\">${this.esc(email)}<\u002Fa>`)}\n${hasPhone ? contactRow(d.uiPhone, this.esc(phone)) : ''}\n<\u002Ftable>\n<\u002Ftd><\u002Ftr>\n${spacer(H.gapB)}\n<tr><td height=\"${H.social}\" style=\"height:${H.social}px;font-size:0;line-height:0\"><table cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr>${socialHtml}<\u002Ftr><\u002Ftable><\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Ftd><\u002Ftr>\n<tr><td colspan=\"3\" style=\"padding-top:16px;font-size:0;line-height:0\"><img src=\"${d.bar || ''}\" alt=\"\" width=\"380\" height=\"4\" style=\"display:block;width:380px;height:4px;border:0\" /><\u002Ftd><\u002Ftr>\n<\u002Ftable>`;\n  }\n\n  copy = () => {\n    const html = this.html();\n    const done = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1800); };\n    try {\n      const item = new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([html], { type: 'text/plain' }) });\n      navigator.clipboard.write([item]).then(done, () => navigator.clipboard.writeText(html).then(done, () => {}));\n    } catch (e) { navigator.clipboard.writeText(html).then(done, () => {}); }\n  };\n\n  set = k => e => this.setState({ [k]: e.target.value });\n\n  addSocial = () => {\n    const used = this.state.socials.map(s => s.kind);\n    const next = Object.keys(PLATFORMS).find(k => k !== 'custom' && !used.includes(k)) || 'custom';\n    this.setState(s => ({ socials: [...s.socials, { id: ++uid, kind: next, url: PLATFORMS[next].url }] }));\n  };\n\n  removeSocial = id => () => this.setState(s => ({ socials: s.socials.filter(x => x.id !== id) }));\n\n  changeKind = id => e => {\n    const kind = e.target.value;\n    this.setState(s => ({ socials: s.socials.map(x => x.id === id ? { ...x, kind, url: PLATFORMS[kind].url } : x) }));\n  };\n\n  changeUrl = id => e => {\n    const url = e.target.value;\n    this.setState(s => ({ socials: s.socials.map(x => x.id === id ? { ...x, url } : x) }));\n  };\n\n  renderVals() {\n    const { name, role, phone, email } = this.state;\n    const kindOptions = Object.entries(PLATFORMS).map(([value, p]) => ({ value, label: p.label }));\n    const socialRows = this.state.socials.map(s => {\n      const p = PLATFORMS[s.kind] || PLATFORMS.custom;\n      return {\n        ...s,\n        label: p.label,\n        letter: p.letter || '',\n        isImg: !!p.icon,\n        isChip: !p.icon,\n        iconStyle: p.icon ? {\n          width: 18, height: 18, display: 'block',\n          backgroundImage: 'url(' + ((this.state.data && this.state.data[p.icon]) || ('icons/' + p.icon + '.png')) + ')',\n          backgroundSize: '18px 18px', backgroundRepeat: 'no-repeat'\n        } : null,\n        onKind: this.changeKind(s.id),\n        onUrl: this.changeUrl(s.id),\n        onRemove: this.removeSocial(s.id)\n      };\n    });\n    return {\n      name, role, phone, email,\n      socialRows, kindOptions, addSocial: this.addSocial,\n      canAdd: this.state.socials.length < 8,\n      roleLine: role + ' | CubCloud AI',\n      hasPhone: !!phone.trim(),\n      mailto: 'mailto:' + email,\n      setName: this.set('name'), setRole: this.set('role'), setPhone: this.set('phone'), setEmail: this.set('email'),\n      copy: this.copy,\n      label: this.state.copied ? 'Copied' : (this.state.data ? 'Copy HTML' : 'Preparing…')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
